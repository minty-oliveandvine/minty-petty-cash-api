[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = petty_cash
# --no-migrations: no migrations by design (Minty owns every table); on SQLite the tables are
# built from the models instead (SHARED_MODELS_MANAGED_FOR_TESTING).
addopts = -v --tb=short --no-migrations
# Every stamp in the schema is TIMESTAMPTZ: a naive datetime anywhere here is a bug.
filterwarnings =
    error:.*received a naive datetime.*:RuntimeWarning
